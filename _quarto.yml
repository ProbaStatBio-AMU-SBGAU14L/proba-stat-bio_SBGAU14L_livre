project:
  type: book
  execute-dir: project
  output-dir: rendered

  # resources:
  #   - figures/**
  #   - figures/generated/**
  #   - figures/manual_exports/**

book:
  title: "Probabilités et statistiques pour la biologie"
  author: 
    - "[Andreas Zanzoni](https://orcid.org/0000-0002-4818-6161)"
    - "[Jacques van Helden](https://orcid.org/0000-0002-8799-8584)"
  date: today
  date-format: "YYYY-MM-DD"
  chapters:
    - index.qmd
    - book/01_introduction.qmd
    - book/02_stat-descr-explor.qmd
    - book/03_echantillonnage-estimation.qmd
    - book/04_egalite-moyennes.qmd
    - book/05_enrichissement-fonctionnel.qmd
    - book/06_ajustement.qmd
    - book/references.qmd

  appendices:
    - book/A1_distrib-theoriques.qmd
    - book/A2_formulas.qmd

bibliography: book/references.bib


knitr:
  opts_chunk:
    fig.width: 7
    fig.height: 5
    fig.align: center
    echo: false
    warning: false
    message: false
    comment: ""

format:
  html:
    theme: 
      - cerulean
    highlight-style: zenburn
    self_contained: yes
    code-tools: true
    code-fold: true
    code-summary: "Afficher le code"
    collapsed: false
    fig_caption: true
    toc: true
    toc-depth: 3
    toc_float: true

  docx: 
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: zenburn


  pdf:
    documentclass: scrreprt
    colorlinks: true
    toc: true
    toc-depth: 3
    number-sections: true
    classoption:
      - numbers=endperiod
    highlight-style: zenburn
    include-in-header:
      - book/cerulean-header.tex


editor: source

